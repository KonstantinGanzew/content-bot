version: '3.8'

# Docker Compose файл только для СБОРКИ образа
# Использование: docker-compose -f docker-compose.build.yml build

services:
  parser-bot-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: parser-bot:latest
    container_name: parser-bot-builder
    
    # Не запускаем контейнер, только собираем образ
    profiles:
      - build-only 